# Name of the workflow
name: Backend CI/CD

on:
  push:
    branches: [main]
    # paths:
    #   - "/**"
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd server
          # pytest  # Uncomment when you add tests
          echo "Tests will run here"

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          cd server
          docker build -t accuratea-backend:latest .

      - name: Test Docker image
        run: |
          docker run -d -p 8000:8000 accuratea-backend:latest
          sleep 10
          curl http://localhost:8000/health || exit 1
